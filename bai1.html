<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bang Diem Cua Em</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            padding-top: 30px;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        /* Đổi tên class để không bị Bootstrap ghi đè */
        .bang-diem-box {
            background-color: #8c8c8c; /* Màu nền xám */
            border: 2px solid #ff0000;   /* Viền đỏ */
            padding: 25px 35px;
            width: 520px;
            box-sizing: border-box;
        }

        h1 {
            color: #2e64fe; /* Tiêu đề màu xanh */
            text-align: center;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .input-row {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
        }

        .input-row span {
            width: 110px;
            font-size: 16px;
            font-weight: normal;
            color: #000;
        }

        .input-row input[type="text"] {
            flex: 1;
            padding: 4px 6px;
            font-size: 15px;
            border: 1px solid #777;
            background-color: #ffffff;
        }

        #select {
            width: 60px;
            color: red;
            font-weight: bold;
            padding: 2px;
        }

        #display {
            font-size: 32px;
            margin: 15px 0 10px 0;
            min-height: 40px;
            font-weight: normal;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 15px;
        }

        .btn-group button {
            padding: 3px 20px;
            font-size: 15px;
            background-color: #f0f0f0;
            border: 1px solid #777;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="bang-diem-box">
        <h1>BANG DIEM CUA EM</h1>

        <div class="input-row">
            <span>Semester1:</span>
            <input type="text" id="text_1">
        </div>

        <div class="input-row">
            <span>Semester2:</span>
            <input type="text" id="text_2">
        </div>

        <div class="input-row">
            <span>Year:</span>
            <select id="select">
                <option value="1">1</option>
                <option value="2">2</option>
            </select>
        </div>

        <div class="input-row">
            <span>Summarise:</span>
            <input type="text" id="result" readonly>
        </div>

        <!-- Dòng hiển thị xếp loại "Hoc sinh gioi" -->
        <div id="display"></div>

        <div class="btn-group">
            <button type="button" onclick="myFunction1()">OK</button>
            <button type="button" onclick="myFunction2()">Cancel</button>
        </div>
    </div>

    <script>
        function myFunction1() {
            var a = parseFloat(document.getElementById('text_1').value);
            var b = parseFloat(document.getElementById('text_2').value);
            var selectElem = document.getElementById('select');
            var value = parseInt(selectElem.options[selectElem.selectedIndex].value);
            var k = 0;

            if (isNaN(a) || isNaN(b)) {
                alert("Vui lòng nhập đầy đủ điểm hai học kỳ!");
                return;
            }

            // Case 1 và Case 2 chuẩn theo đề bài
            switch (value) {
                case 1:
                    k = (a + b) / 2;
                    break;
                case 2:
                    // Công thức chuẩn ra kết quả 9.5714... khi nhập 9 và 10
                    k = ((a * 3) + (b * 4)) / 7;
                    break;
            }

            // In kết quả điểm tổng kết
            document.getElementById('result').value = k;

            // Đổi màu và in chữ xếp loại
            var displayElem = document.getElementById('display');
            if (k >= 9) {
                displayElem.innerHTML = "Hoc sinh gioi";
                displayElem.style.color = "red";
            } else if (k >= 7 && k < 9) {
                displayElem.innerHTML = "Hoc sinh kha";
                displayElem.style.color = "blue";
            } else if (k >= 5 && k < 7) {
                displayElem.innerHTML = "Hoc sinh trung binh";
                displayElem.style.color = "yellow";
            } else {
                displayElem.innerHTML = "Hoc sinh yeu";
                displayElem.style.color = "black";
            }
        }

        function myFunction2() {
            document.getElementById('text_1').value = "";
            document.getElementById('text_2').value = "";
            document.getElementById('result').value = "";
            document.getElementById('display').innerHTML = "";
            document.getElementById('select').value = "1";
        }
    </script>
</body>
</html>
